name: CI

on:
  pull_request:
    branches: [main]

env:
  ISABELLE_DOCKER_IMAGE: makarius/isabelle:Isabelle2025-2

jobs:
  quick:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: extract Python code
        run: /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Test_Quick

      - name: Run quick test suite
        run: uv run pytest test/quick/run_test.py

  diff:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: extract Python code
        run: /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Examples

      - name: Run diff test suite
        run: uv run pytest test/diff/run_test.py

  slow:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: extract Python code
        run: ISABELLE_PYTHON=1 /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Test_Slow

      - name: syntax check generated code
        run: |
          uv run python -m py_compile test/slow/generated_basic/*.py
          uv run python -m py_compile test/slow/generated_full/*.py
          
