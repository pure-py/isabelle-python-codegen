name: CI

on:
  pull_request:
    branches: [main]

env:
  ISABELLE_DOCKER_IMAGE: makarius/isabelle:Isabelle2025-2

jobs:
  quick:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: extract Python code
        run: /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Test_Quick

      - name: Run quick test suite
        run: uv run pytest test/quick/run_test.py

  diff:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # -o python_type_annotations needs the option declared in etc/options, which Isabelle
      # only reads for a registered component; the Python session must be built after this,
      # or it is compiled without the option and -o has no effect
      - name: register component
        run: /home/isabelle/Isabelle/bin/isabelle components -u "$PWD"

      - name: extract Python code
        run: /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Examples

      - name: Run diff test suite
        run: uv run pytest test/diff/run_test.py

      - name: extract Python code with type annotations
        run: |
          /home/isabelle/Isabelle/bin/isabelle build -v -d . -c -o python_type_annotations -e Python_Examples
          grep -q "from __future__ import annotations" examples/python_out/Python_Examples.Example/code/Example.py

      - name: Run diff test suite on annotated code
        run: uv run pytest test/diff/run_test.py

      - name: type-check generated code
        # each example has its own copy of the library modules, so check them one by one
        run: |
          status=0
          for d in examples/python_out/*/code; do uv run mypy "$d" || status=1; done
          exit $status

  oracle:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install python3/pip and pytest
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pip
          pip3 install --break-system-packages pytest 2>/dev/null || pip3 install pytest

      - name: extract Python code
        run: /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Test_Oracle

      - name: Run oracle test suite
        run: pytest test/oracle/run_test.py --tb=line

  slow:
    runs-on: ubuntu-latest
    container:
      image: makarius/isabelle:Isabelle2025-2
      options: --user root
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # -o python_type_annotations needs the option declared in etc/options, which Isabelle
      # only reads for a registered component; the Python session must be built after this,
      # or it is compiled without the option and -o has no effect
      - name: register component
        run: /home/isabelle/Isabelle/bin/isabelle components -u "$PWD"

      - name: extract Python code
        run: ISABELLE_PYTHON=1 /home/isabelle/Isabelle/bin/isabelle build -v -d . -e Python_Test_Slow

      - name: syntax check generated code
        run: |
          uv run python -m py_compile test/slow/generated_basic/*.py
          uv run python -m py_compile test/slow/generated_full/*.py

      - name: import check generated code
        run: uv run pytest test/slow/run_test.py --tb=line

      - name: extract Python code with type annotations
        run: |
          /home/isabelle/Isabelle/bin/isabelle build -v -d . -c -o python_type_annotations -e Python_Test_Slow
          grep -q "from __future__ import annotations" test/slow/generated_full/Nat.py

      - name: type-check generated code
        run: |
          uv run mypy test/slow/generated_basic
          uv run mypy test/slow/generated_full
          
